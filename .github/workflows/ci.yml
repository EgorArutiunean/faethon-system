name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file .github/actionlint.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Coolify Compose
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/check_coolify_compose.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_test.db
      AUTH_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app scripts tests alembic
      - name: Ruff format
        run: ruff format --check app scripts tests alembic
      - name: Backend typecheck
        run: mypy --cache-dir=/tmp/mypy-cache app scripts
      - run: python -m compileall -q app scripts
      - name: Backend tests and coverage gate
        run: >-
          python -m pytest -q
          --cov=app
          --cov-branch
          --cov-fail-under=82.5
          --cov-report=term
          --cov-report=xml:coverage.xml
          --junitxml=pytest-backend.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/pytest-backend.xml
            backend/coverage.xml
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          retention-days: 14

  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: buy_modern_test
          POSTGRES_USER: buy_test
          POSTGRES_PASSWORD: buy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buy_test -d buy_modern_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://buy_test:buy_test@127.0.0.1:5432/buy_modern_test
      TEST_POSTGRES_URL: postgresql+psycopg://buy_test:buy_test@127.0.0.1:5432/buy_modern_test
      AUTH_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Upgrade from previous release revision
        run: |
          alembic upgrade 0013_manager_cash_permissions
          alembic upgrade head
      - run: alembic check
      - name: Run PostgreSQL concurrency and accounting core
        run: >-
          python -m pytest -q
          tests/test_postgres_concurrency.py
          tests/test_postgres_accounting_core.py
          --junitxml=pytest-postgres.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-test-results
          path: backend/pytest-postgres.xml
          retention-days: 14

  real-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres-integrity]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:prod
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-e2e-playwright-report
          path: frontend/playwright-report
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python lock
        id: python-audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit==2.10.1
          pip-audit --requirement backend/requirements-dev.txt --format json --output pip-audit.json
      - name: Audit production npm dependencies
        id: npm-audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency audit gate
        if: always()
        run: |
          test "${{ steps.python-audit.outcome }}" = "success"
          test "${{ steps.npm-audit.outcome }}" = "success"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          category: /language:${{ matrix.language }}

  container-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build exact production images
        run: docker compose -f docker-compose.prod-e2e.yml build
      - name: Scan repository secrets and misconfiguration
        id: repository-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: json
          output: trivy-repository.json
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Scan backend image
        id: backend-image-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: buy-modern-backend-prod-e2e:latest
          format: json
          output: trivy-backend-image.json
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        id: frontend-image-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: buy-modern-frontend-prod-e2e:latest
          format: json
          output: trivy-frontend-image.json
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate backend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: buy-modern-backend-prod-e2e:latest
          format: spdx-json
          output-file: backend.spdx.json
          artifact-name: backend-sbom.spdx.json
          upload-release-assets: false
          upload-artifact-retention: 30
      - name: Generate frontend SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: buy-modern-frontend-prod-e2e:latest
          format: spdx-json
          output-file: frontend.spdx.json
          artifact-name: frontend-sbom.spdx.json
          upload-release-assets: false
          upload-artifact-retention: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-security-reports
          path: trivy-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce repository and image security gate
        if: always()
        run: |
          test "${{ steps.repository-scan.outcome }}" = "success"
          test "${{ steps.backend-image-scan.outcome }}" = "success"
          test "${{ steps.frontend-image-scan.outcome }}" = "success"
