x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-backend-runtime: &backend-runtime
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable image digest}
  environment: &backend-environment
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: json
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY is required}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
    LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
    LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
    IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-10485760}
    IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-20000}
    IMPORT_XLSX_MAX_UNCOMPRESSED_BYTES: ${IMPORT_XLSX_MAX_UNCOMPRESSED_BYTES:-52428800}
    IMPORT_XLSX_MAX_ENTRIES: ${IMPORT_XLSX_MAX_ENTRIES:-1000}
    IMPORT_XLSX_MAX_COMPRESSION_RATIO: ${IMPORT_XLSX_MAX_COMPRESSION_RATIO:-100}
    CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}

services:
  postgres:
    image: postgres:16@sha256:71e27bf60b70bded003791b5573f8b808365613f341df20ffcf0c1ed7bc13ddf
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-200}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend-runtime
    restart: "no"
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATE_CPU_LIMIT:-0.5}
    pids_limit: ${MIGRATE_PIDS_LIMIT:-128}
    logging: *default-logging
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-runtime
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable image digest}
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
