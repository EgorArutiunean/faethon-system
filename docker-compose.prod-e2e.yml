services:
  postgres:
    image: postgres:16@sha256:71e27bf60b70bded003791b5573f8b808365613f341df20ffcf0c1ed7bc13ddf
    environment:
      POSTGRES_DB: buy_modern_prod_e2e
      POSTGRES_USER: buy_prod_e2e
      POSTGRES_PASSWORD: buy_prod_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buy_prod_e2e -d buy_modern_prod_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: buy-modern-backend-prod-e2e
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment: &backend-environment
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://buy_prod_e2e:buy_prod_e2e@postgres:5432/buy_modern_prod_e2e
      AUTH_SECRET_KEY: prod-e2e-only-secret-key-at-least-32-characters
      ACCESS_TOKEN_MINUTES: 30
      CORS_ORIGINS: http://127.0.0.1:18080
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: buy-modern-backend-prod-e2e
    environment: *backend-environment
    command: ["python", "scripts/seed_e2e.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: buy-modern-backend-prod-e2e
    environment: *backend-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    image: buy-modern-frontend-prod-e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEMO_MODE: "false"
    ports:
      - "18080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 2s
      timeout: 5s
      retries: 30
