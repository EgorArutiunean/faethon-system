[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F403"]
"tests/*.py" = ["F403"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["alembic/versions", "tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/db/base.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.coverage.xml]
output = "coverage.xml"
