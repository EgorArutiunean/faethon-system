# Use Coolify's managed Docker Compose application mode (not Raw mode).
# Coolify consumes exclude_from_hc before handing this file to Docker Compose.
# Local validation: python scripts/check_coolify_compose.py
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-backend: &backend
  image: ${BACKEND_IMAGE:?Use the backend image@sha256 from the release manifest}
  environment:
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: json
    RELEASE_VERSION: ${RELEASE_VERSION:?Release version is required}
    DATABASE_URL: ${DATABASE_URL:?Database URL is required}
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Authentication secret is required}
    CORS_ORIGINS: ${CORS_ORIGINS:?Explicit HTTPS origin is required}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
    LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
    LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
    IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-10485760}
    IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-20000}
    IMPORT_XLSX_MAX_UNCOMPRESSED_BYTES: ${IMPORT_XLSX_MAX_UNCOMPRESSED_BYTES:-52428800}
    IMPORT_XLSX_MAX_ENTRIES: ${IMPORT_XLSX_MAX_ENTRIES:-1000}
    IMPORT_XLSX_MAX_COMPRESSION_RATIO: ${IMPORT_XLSX_MAX_COMPRESSION_RATIO:-100}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  logging: *logging

services:
  postgres:
    image: postgres:16@sha256:71e27bf60b70bded003791b5573f8b808365613f341df20ffcf0c1ed7bc13ddf
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: 200
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Database name is required}
      POSTGRES_USER: ${POSTGRES_USER:?Database user is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    <<: *backend
    restart: "no"
    exclude_from_hc: true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?Use the frontend image@sha256 from the release manifest}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logging
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
